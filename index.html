<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkinProfile roadmap</title>
<style>
/* One long left-to-right chart in a horizontal scroller. Light only by design. */
:root { color-scheme: light; --bg: #ffffff; --ink: #1a222c; --muted: #58626f; --line: #d5dbe4; --accent: #2a50c4;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; }
.wrap { padding: 14px 16px 16px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hint { font-size: 13px; color: var(--muted); margin-right: auto; }
.zoom { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.zoom button { font: 600 13px var(--font); color: var(--ink); background: var(--bg); border: 0; padding: 5px 11px; cursor: pointer; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button[aria-pressed="true"] { background: var(--accent); color: #ffffff; }
.scroller { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 80px); background: var(--bg); }
.scroller svg { display: block; height: auto; max-width: none; width: 11462px; }
</style>
</head>

<div class="wrap">

  <div class="bar">

    <div class="zoom" role="group" aria-label="Chart zoom">
      <button type="button" data-f="0.5" aria-pressed="false">50%</button>
      <button type="button" data-f="0.75" aria-pressed="true">75%</button>
      <button type="button" data-f="1" aria-pressed="false">100%</button>
    </div>
  </div>
  <div class="scroller" id="scroller">

      var c = (sc.scrollLeft + sc.clientWidth / 2) / svg.getBoundingClientRect().width;
      svg.style.width = Math.round(W * f) + "px";
